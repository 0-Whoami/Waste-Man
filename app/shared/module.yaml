product:
  type: kmp/lib
  platforms: [ wasmJs ]

dependencies:
  - //core
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.material.icons.extended
  - $ktor.client.core

settings:
  ktor: enabled
  compose:
    enabled: true
    resources:
      packageName: com.example.wasteman.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
